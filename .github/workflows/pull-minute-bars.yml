name: Collect 1-minute market data

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    # Multiple runs allow the New York-time guard below to handle
    # both EDT and EST automatically.
    - cron: '20 20,21,22 * * 1-5'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check New York time
        id: guard
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))

          # Scheduled collection window:
          # Weekdays from 4:15 PM through 5:59 PM ET.
          #
          # workflow_dispatch (manual runs) bypasses this guard
          # in the steps below.
          ok = (
              now.weekday() < 5
              and 16 <= now.hour <= 17
              and (now.hour > 16 or now.minute >= 15)
          )

          print("Current ET:", now)
          print("Run collection:", ok)

          with open("/tmp/run_status.txt", "w") as f:
              f.write("true" if ok else "false")
          PY

          echo "run=$(cat /tmp/run_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Collect minute bars
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python pull_minute_bars.py

      - name: Compute metrics
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python compute_metrics.py

      - name: Commit market data
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet
          then
            echo "No new data to commit."
            exit 0
          fi

          git commit -m "Automated market minute data"
          git push
