name: Collect 1-minute market data

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    # Multiple scheduled runs provide redundancy.
    # The New York-time guard below handles EDT/EST automatically.
    #
    # 20:20 UTC = 4:20 PM ET during EDT / 3:20 PM ET during EST
    # 21:20 UTC = 5:20 PM ET during EDT / 4:20 PM ET during EST
    # 22:20 UTC = 6:20 PM ET during EDT / 5:20 PM ET during EST
    #
    # Any scheduled run occurring after 4:15 PM ET is allowed to collect.
    # This also protects against GitHub Actions starting a scheduled job late.
    - cron: '20 20,21,22 * * 1-5'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check New York time
        id: guard
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))

          # Allow scheduled collection on weekdays at any time
          # from 4:15 PM ET onward.
          #
          # This intentionally has NO upper time limit. GitHub Actions
          # scheduled jobs can occasionally start late. A delayed run
          # should still collect the completed trading session rather
          # than silently skipping it.
          #
          # workflow_dispatch (manual runs) bypasses this guard below.
          ok = (
              now.weekday() < 5
              and (
                  now.hour > 16
                  or (now.hour == 16 and now.minute >= 15)
              )
          )

          print("Current ET:", now)
          print("Run collection:", ok)

          with open("/tmp/run_status.txt", "w") as f:
              f.write("true" if ok else "false")
          PY

          echo "run=$(cat /tmp/run_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Collect minute bars
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python pull_minute_bars.py

      - name: Compute metrics
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python compute_metrics.py

      - name: Commit market data
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet
          then
            echo "No new data to commit."
            exit 0
          fi

          git commit -m "Automated market minute data"
          git push
